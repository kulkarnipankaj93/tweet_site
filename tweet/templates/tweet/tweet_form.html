{% extends "layout.html" %}

{% block title %}
tweets
{% endblock %}

{% block content %}
<h1 class="text-centre mt-4">Welcome to tweeting site</h1>
<h2>
    {% if form.instance.pk %}
    Edit Tweet
    {% else %}
    Create tweet
    {% endif %}
    <form method="post" enctype="multipart/form-data"
          class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-warning" type="submit">Submit</button>
        <a href="{% url 'tweet:tweet_list'%}">Back to Tweet list</a>
    </form>
</h2>
{% endblock %}
