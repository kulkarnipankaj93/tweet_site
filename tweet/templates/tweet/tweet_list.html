{% extends "layout.html" %}

{% block title %}
tweets
{% endblock %}

{% block content %}
<h1 class="text-centre mt-4">Welcome to tweeting site</h1>
<a class="btn btn-primary" href="{% url 'tweet:tweet_create' %}">Create a tweet</a>
<div class="conatiner row gap-3">
    {% for tweet in tweets %}
        <div class="card mt-4" style="width: 18rem;">
  <img src="{{ tweet.photo.url }}" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">{{ tweet.user.username}}</h5>
    <p class="card-text">{{ tweet.text }}</p>
      {% if tweet.user == user %}
    <a href="{% url 'tweet:tweet_edit' tweet.id %}" class="btn btn-primary">Edit</a>
      <a href="{% url 'tweet:tweet_delete' tweet.id %}" class="btn btn-danger">Delete</a>
      {% endif %}
  </div>
</div>

    {% endfor %}
</div>
{% endblock %}
